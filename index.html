if(s==2)b=['Medina','Coastal','Souks'].map(k=>'<label class="card p-3 mb-2 flex gap-2"><input type="checkbox" '+(w.int.includes(k)?'checked':'')+' onchange="tg(\''+k+'\')"> '+({Medina:'Medina & Historical Monuments / المآثر التاريخية',Coastal:'Coastal Nature',Souks:'Local Souks'})[k]+'</label>').join('')+'<div class="flex gap-2 mt-2">'+['Adventure','Calm'].map(v=>'<button class="flex-1 '+(w.vibe==v?'btn':'btn2')+'" onclick="S.wiz.vibe=\''+v+'\';render()">'+(v=='Calm'?'Calm & Relax':v)+'</button>').join('')+'</div>';
if(s==3)b='<label class="text-sm">Total budget (MAD)</label><input type="number" class="inp mb-3" value="'+w.budget+'" oninput="S.wiz.budget=+this.value||0">'+Object.keys(w.al).map(k=>'<div class="text-sm">'+k+': <b id="al'+k+'">'+w.al[k]+'</b>%</div><input type="range" class="w-full" value="'+w.al[k]+'" oninput="S.wiz.al[\''+k+'\']=+this.value;$(\'#al'+k+'\').textContent=this.value">').join('');
if(s==4)b='<p class="mb-3 text-sm">'+w.days+' day(s) · '+w.int.join(', ')+' · '+w.vibe+' · '+w.budget+' MAD</p><button class="btn w-full" id="gb" onclick="genPlan()">'+t('gen')+'</button>';
return '<h1 class="text-xl font-bold mb-1">🧭 '+t('plan')+'</h1><div class="text-xs mb-3 opacity-70">Step '+s+' / 4</div><div class="card p-4">'+b+'</div><div class="flex justify-between mt-3">'+(s>1?'<button class="btn2" onclick="S.step--;render()">'+t('back')+'</button>':'<span></span>')+(s<4?'<button class="btn" onclick="S.step++;render()">'+t('next')+'</button>':'')+'</div>'}
function tg(k){const a=S.wiz.int;a.includes(k)?a.splice(a.indexOf(k),1):a.push(k)}
function pool(){const m={Medina:['heritage','workshops'],Coastal:['activities','heritage'],Souks:['shopping','food']};let cs=[];S.wiz.int.forEach(k=>cs=cs.concat(m[k]));if(!cs.length)cs=['heritage','food'];return D.filter(x=>cs.includes(x.c)&&x.c!='hotels')}
function genPlan(){$('#gb').innerHTML='⏳ Building your route...';setTimeout(()=>{const p=pool().sort((a,b)=>b.r-a.r),n=S.wiz.days;S.plan=Array.from({length:n},(_,d)=>[0,1,2].map(i=>p[(d*3+i)%p.length].id));render()},1200)}
function total(){let s=0;S.plan.forEach(d=>d.forEach(i=>s+=D[i].m+10));return s+S.plan.length*30}
function dash(){const T0=['09:30','13:00','16:30'],tot=total(),ok=tot<=S.wiz.budget;return '<h1 class="text-xl font-bold mb-2">Your Bawsala Plan</h1><div class="card p-3 mb-2 text-sm">☀️ <b>Sunny, 22°C</b> — ideal for Kasbah walking<br>🎉 Local culture event: Tangier open-air music nights this week<br>📶 eSIM tip: Orange or Inwi tourist data ~50 MAD at the port</div><div class="card p-3 mb-3 font-bold '+(ok?'text-emerald-700':'text-red-600')+'">Total: '+tot+' MAD / budget '+S.wiz.budget+' MAD</div>'+S.plan.map((d,di)=>'<h3 class="font-bold mt-2">Day '+(di+1)+'</h3>'+d.map((id,si)=>{const x=D[id];return '<div class="card p-3 my-1 flex justify-between gap-2"><div class="text-sm"><b>'+T0[si]+'</b> '+x.e+' '+x.n+'<div class="opacity-70 text-xs">'+x.m+' MAD · transport ~10 MAD</div></div><button class="btn2 !py-1 text-xs" onclick="swapM('+di+','+si+')">'+t('swap')+'</button></div>'}).join('')+'<div class="text-xs opacity-70">Local transport fee included: 30 MAD</div>').join('')+'<button class="btn2 w-full mt-3" onclick="S.plan=null;S.step=1;render()">New plan</button>'}
function swapM(d,s){const cur=S.plan[d][s];openM('<h2 class="font-bold mb-2">Choose a replacement</h2>'+D.filter(x=>x.c!='hotels'&&x.id!=cur).slice(0,12).map(x=>'<button class="card w-full p-2 my-1 text-left text-sm" onclick="doSwap('+d+','+s+','+x.id+')">'+x.e+' '+x.n+' — '+x.m+' MAD</button>').join(''))}
function doSwap(d,s,id){S.plan[d][s]=id;closeM();render()}
// ---- Match
function score(p){const me=S.prof.hobbies.toLowerCase().split(/[ ,]+/).filter(Boolean);const sh=p.i.filter(i=>me.some(m=>i.includes(m)||m.includes(i)));return {pct:Math.min(98,70+sh.length*10+(Math.abs(p.bud-S.wiz.budget/S.wiz.days)<300?8:0)),sh}}
function matchV(){const p=PEOPLE[S.deck%PEOPLE.length],sc=score(p);return '<h1 class="text-xl font-bold mb-2">🤝 Bawsala Match</h1><div id="sc" class="card overflow-hidden sw touch-pan-y" onpointerdown="sd(event)" onpointerup="su(event)"><div class="h-40 flex items-center justify-center text-7xl" style="background:linear-gradient(135deg,#0f6b52,#0f2b48)">'+['👩🏽','🧑🏼','👩🏻‍🦱','🧔🏽'][S.deck%4]+'</div><div class="p-4"><b class="text-lg">'+p.n+', '+p.a+'</b> <span class="text-sm opacity-80">from '+p.o+'</span><div class="text-sm">📅 '+p.d+' · 💰 ~'+p.bud+' MAD/day</div><p class="text-sm my-2">'+p.b+'</p><div class="chip">'+sc.pct+'% Match: '+(sc.sh.length?'shared '+sc.sh.join(', '):'similar budget and travel dates')+'</div></div></div><div class="flex justify-center gap-8 mt-4"><button class="text-4xl card w-16 h-16 !rounded-full" onclick="nextP(false)" title="'+t('pass')+'">❌</button><button class="text-4xl card w-16 h-16 !rounded-full" onclick="nextP(true)" title="'+t('conn')+'">💚</button></div><p class="text-center text-xs opacity-70 mt-2">Swipe the card or tap a button</p>'}
let sx=0;function sd(e){sx=e.clientX}function su(e){const d=e.clientX-sx;if(Math.abs(d)>70)nextP(d>0)}
function nextP(yes){const p=PEOPLE[S.deck%PEOPLE.length];S.deck++;if(yes){S.chat=[['them','Hi! I saw we both like '+p.b.split(',')[0].toLowerCase()+'. Want to do a workshop together?']];chatM(p)}else render()}
function chatM(p){render();openM('<h2 class="font-bold">🎉 Match found! You and '+p.n+'</h2><div id="ch" class="my-2 space-y-1 text-sm"></div><div class="flex gap-2"><input id="ci" class="inp" placeholder="Message..."><button class="btn" onclick="send(\''+p.n+'\')">Send</button></div>');drawChat()}
function drawChat(){$('#ch').innerHTML=S.chat.map(m=>'<div class="'+(m[0]=='me'?'text-right':'')+'"><span class="inline-block px-3 py-1 rounded-xl '+(m[0]=='me'?'bg-[#c8553d] text-white':'chip !text-inherit')+'">'+m[1]+'</span></div>').join('')}
function send(n){const i=$('#ci'),v=i.value.trim();if(!v)return;S.chat.push(['me',v]);i.value='';drawChat();setTimeout(()=>{S.chat.push(['them',['Sounds great!','Pottery on Friday at 10?','Meet at Grand Socco?'][S.chat.length%3]]);if($('#ch'))drawChat()},900)}
// ---- Profile
function profV(){const p=S.prof;return '<h1 class="text-xl font-bold mb-2">👤 '+t('profile')+'</h1><div class="card p-4"><div class="text-center mb-3"><div class="w-20 h-20 rounded-full mx-auto bg-[#0f2b48] text-white text-3xl flex items-center justify-center overflow-hidden" id="av">'+(S.photo?'<img src="'+S.photo+'" class="w-full h-full object-cover">':(p.name[0]||'🙂'))+'</div><input type="file" accept="image/*" class="text-xs mt-2" onchange="photo(this)"></div><input class="inp mb-2" placeholder="Name" value="'+p.name+'" oninput="S.prof.name=this.value"><input class="inp mb-2" placeholder="Age" type="number" value="'+p.age+'" oninput="S.prof.age=this.value"><input class="inp mb-2" placeholder="Hobbies (history, photo, food, crafts...)" value="'+p.hobbies+'" oninput="S.prof.hobbies=this.value"><input class="inp mb-2" placeholder="Visited cities" value="'+p.cities+'" oninput="S.prof.cities=this.value"><select class="inp mb-2" onchange="S.prof.vibe=this.value"><option>Calm</option><option '+(p.vibe=='Adventure'?'selected':'')+'>Adventure</option></select><button class="btn w-full" onclick="saveP()">'+t('save')+'</button></div><p class="text-xs opacity-70 mt-2">Your hobbies tune the match scores. Data stays in this session only.</p>'}
function photo(el){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{S.photo=r.result;render()};r.readAsDataURL(f)}
function saveP(){openM('<div class="text-center py-4"><div class="text-4xl">✅</div><p>Profile saved. Match scores are updated.</p></div>')}
render();
</script>
</body>
</html>
